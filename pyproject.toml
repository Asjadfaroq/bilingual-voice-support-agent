[project]
name = "voice-agent"
version = "0.1.0"
description = "Real-time Arabic/English voice support agent on LiveKit, ElevenLabs and Claude"
readme = "README.md"
authors = [
    { name = "Aajadfaroq", email = "asjadfarooq22@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "anthropic>=1.17.0",
    "httpx>=0.28.1",
    "livekit-agents[anthropic,elevenlabs,silero]~=1.8",
    "livekit-api>=1.2.2",
    "num2words>=0.5.14",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["evals"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["database: needs the pgvector database from docker compose"]
